name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Bounded: GitHub's default is 6 HOURS. awvoice's listen suite blocks on a
    # missing audio device (measured 2026-10-07) -- unbounded, one such test
    # holds a runner for the whole default and reads as "CI is slow".
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: import smoke
        shell: bash
        run: |
          set -e
          awrepl --help >/dev/null 2>&1 || awrepl --version >/dev/null 2>&1 || python -c "import awrepl"
      - name: tests
        if: ${{ hashFiles('tests/**', 'test/**') != '' }}
        shell: bash
        run: |
          python -m pip install pytest pytest-asyncio
          # `cmd; rc=$?` dies under the runner's `bash -e` BEFORE the tolerance
          # line -- `|| rc=$?` is the only spelling that survives it.
          rc=0
          # asyncio_mode=auto: bare `async def` tests (awgraph) run instead of
          # failing "not natively supported" -- strict mode needs markers no
          # generic rollout can add.
          # The TEST DIR only, never the repo root: a bare `pytest` also
          # collects shipped examples, and awflow's examples/test_resume.py
          # collided with tests/test_resume.py ("import file mismatch").
          d=tests; [ -d tests ] || d=test
          python -m pytest -x -q -o asyncio_mode=auto "$d" || rc=$?
          # exit 5 = collected nothing (every test skipped/absent). That is
          # "no verdict", not "failed" -- awpredict went red on exactly this.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]
